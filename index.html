<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a10">
  <meta name="description" content="牌境 · 一副会呼吸的牌。卡牌肉鸽、自由构筑、自定义卡牌效果与主角/敌人形象。">
  <title>牌境 · The Card Realm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0a10'/%3E%3Crect x='12' y='9' width='30' height='44' rx='5' fill='none' stroke='%23d4b071' stroke-width='2.4' transform='rotate(-9 27 31)'/%3E%3Crect x='22' y='12' width='30' height='44' rx='5' fill='%2319131e' stroke='%23d4b071' stroke-width='2.4' transform='rotate(7 37 34)'/%3E%3Cpath d='M37 22l2.8 7.4L47 32l-7.2 2.6L37 42l-2.8-7.4L27 32l7.2-2.6z' fill='%23e9d3a0'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/realm-bg.webp">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/battle.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/world.css">
  <link rel="stylesheet" href="css/fx.css">
  <link rel="stylesheet" href="css/online.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/live-art.css">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__card">
      <span class="boot__glyph">梦</span>
      <span class="boot__orbit"></span>
    </div>
    <p>正在翻开梦境<span class="boot__dots">…</span></p>
  </div>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="portrait-file" accept="image/*" hidden>
  <input type="file" id="audio-file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.opus" hidden>
  <input type="file" id="save-file" accept="application/json,.json" hidden>
  <noscript>
    <div class="noscript">牌境需要启用 JavaScript 才能翻开。</div>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
